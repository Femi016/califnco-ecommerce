version: '3.8'

services:
  # n8n Workflow Automation Platform (Free Self-Hosted)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: califnco-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./products_feed.json:/home/node/products_feed.json:ro

  # WAHA (WhatsApp HTTP API - Free Open Source for WhatsApp Status Automation)
  waha:
    image: devlikeapro/waha:latest
    container_name: califnco-waha
    restart: always
    ports:
      - "3000:3000"
    environment:
      - WAHA_LOG_LEVEL=info
      - WAHA_PRINT_QR=true
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=true
    volumes:
      - waha_data:/app/.sessions

volumes:
  n8n_data:
  waha_data:
